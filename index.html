<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUA-sjekk</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #222; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  h3 { font-size: 13px; margin: 14px 0 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #666; margin: 14px 0 6px; }
  .muted { color: #777; font-size: 12px; }
  label.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 5px 0; }
  label.row input[type=text] { width: 64px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font: inherit; text-align: right; }
  label.check { display: flex; gap: 6px; align-items: center; margin: 5px 0; }
  .ratio { display: flex; align-items: center; gap: 4px; }
  .ratio input { width: 50px !important; }
  button { font: inherit; padding: 7px 10px; border-radius: 4px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; }
  button.primary { background: #0696d7; border-color: #0696d7; color: #fff; font-weight: 600; width: 100%; padding: 9px; margin-top: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  .btns button { flex: 1; }
  .status { margin-top: 8px; color: #555; font-size: 12px; }
  .status.error { color: #b00020; }
  .sel { background: #f0f7fc; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
  table.res { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.res td { padding: 4px 0; border-bottom: 1px solid #eee; }
  table.res td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  table.res tr.total td { font-weight: 700; border-bottom: none; padding-top: 8px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .pass { color: #1e7b34; } .fail { color: #b00020; }
  .pick { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .pick > div { flex: 1; display: flex; flex-direction: column; font-size: 12px; }
  .pick > div span { color: #666; }
  .pick button { padding: 4px 8px; font-size: 12px; }
  .sel { margin: 6px 0; }
  table.grid th { text-align: right; font-weight: 600; font-size: 12px; color: #666; padding: 2px 0; }
  table.grid td + td { padding-left: 8px; }
  .areaHead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { padding: 4px 10px; border-radius: 4px; border: 1px solid #0696d7; background: #fff; color: #0b5f8a; font-size: 12px; }
  .chip.on { background: #0696d7; color: #fff; }
  .btns.small button { padding: 4px 6px; font-size: 12px; flex: none; }
  .btns.small button#setRegion { flex: 1; }
  details { margin-top: 10px; } summary { cursor: pointer; color: #666; font-size: 12px; }
</style>
</head>
<body>
  <h1>MUA-sjekk</h1>
  <div class="muted">Regner ut uteoppholdsareal som oppfyller kravene, og fargelegger terrenget.</div>

  <h2>Område og flater</h2>
  <div class="muted">Velg elementer i 3D (klikk, shift-klikk for flere), og trykk «Bruk valgte» på riktig linje.</div>
  <div class="sel" id="selNow">…</div>
  <div class="areaHead"><b>Analyseområder</b><span class="muted" id="areaInfo"></span></div>
  <div class="chips" id="areaChips"></div>
  <div class="btns small">
    <button id="allAreas">Velg alle</button>
    <button id="clrRegion">Fjern valg</button>
    <button id="setRegion" title="Legg til elementer valgt i 3D som område">Legg til valgte</button>
    <button id="refreshAreas" title="Les inn områdene på nytt">↻</button>
  </div>
  <div class="pick"><div><b>Lokk</b><span id="pickLokk">…</span></div><button id="setLokk">Bruk valgte</button><button id="clrLokk" title="Fjern">×</button></div>
  <div class="pick"><div><b>Tak / takterrasse</b><span id="pickTak">…</span></div><button id="setTak">Bruk valgte</button><button id="clrTak" title="Fjern">×</button></div>

  <h2>Hva teller som MUA</h2>
  <label class="row">Avstand fra bygg (m) <input type="text" id="buffer" value="2"></label>
  <label class="row">Maks helning <span class="ratio">1 : <input type="text" id="ratio" value="3"></span></label>
  <label class="row">Minste bredde (m, 0 = av) <input type="text" id="minWidth" value="0"></label>
  <label class="row">Objekter lavere enn (m) er lokk <input type="text" id="lokk" value="0"></label>
  <label class="check"><input type="checkbox" id="roads" checked> Trekk fra veier</label>

  <h2>Sol</h2>
  <label class="check"><input type="checkbox" id="sun" checked> Beregn solbelyst MUA</label>
  <div id="sunOpts">
    <label class="row">Dato (dag / måned) <span class="ratio"><input type="text" id="sunDay" value="1"> / <input type="text" id="sunMonth" value="5"></span></label>
    <label class="row">Minst timer sol totalt <input type="text" id="hTotal" value="5"></label>
    <label class="row">Minst timer sol i tidsrom <input type="text" id="hWin" value="3"></label>
    <label class="row">Tidsrom (kl.) <span class="ratio"><input type="text" id="winFrom" value="15"> – <input type="text" id="winTo" value="20"></span></label>
    <label class="check"><input type="checkbox" id="trees"> Trær gir skygge</label>
  </div>

  <h2>Utearealnorm</h2>
  <label class="row">BRA bolig (m²) <input type="text" id="bra" value=""></label>
  <label class="row">MUA i % av BRA <input type="text" id="muaPct" value="20"></label>
  <label class="row">Solbelyst andel av MFUA (%) <input type="text" id="sunPct" value="40"></label>
  <label class="row">Andel av solbelyst på terreng/lokk (%) <input type="text" id="groundPct" value="60"></label>

  <button class="primary" id="run">Kjør analyse</button>
  <div class="btns">
    <button id="export">Last ned bilde</button>
    <button id="clear">Fjern farger</button>
  </div>
  <div class="status" id="status"></div>
  <div id="results"></div>

  <details>
    <summary>Avansert</summary>
    <label class="row">Rutenett (m) <input type="text" id="cell" value="0.5"></label>
    <label class="row">Tidssteg sol (min) <input type="text" id="sunStep" value="10"></label>
    <label class="row">Skyggesone rundt området (m) <input type="text" id="shadowPad" value="150"></label>
    <label class="check"><input type="checkbox" id="flip"> Snu fargekartet (hvis det ligger speilvendt)</label>
  </details>
